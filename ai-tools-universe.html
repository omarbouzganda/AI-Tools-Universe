<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Universe 2026 — All AI Models in One Place</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#05050a;--surface:#0c0c14;--elevated:#12121c;--border:rgba(255,255,255,0.06);--text:#fff;--text2:#a1a1aa;--text3:#52525b;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--pink:#ec4899;--indigo:#6366f1;--orange:#f97316;--teal:#14b8a6;--lime:#84cc16;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px;}

/* Background Orbs */
.orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:0.15;pointer-events:none;z-index:0;}
.orb-1{width:50vw;height:50vw;background:var(--blue);top:-15%;right:-10%;animation:floatA 30s infinite alternate;}
.orb-2{width:45vw;height:45vw;background:var(--purple);bottom:-15%;left:-10%;animation:floatA 25s infinite alternate;}
.orb-3{width:35vw;height:35vw;background:var(--cyan);top:35%;left:40%;animation:floatA 35s infinite alternate;}
@keyframes floatA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(5%,3%) scale(1.15)}}

/* Layout */
.app{display:flex;min-height:100vh;position:relative;z-index:1;}

/* Sidebar */
.sidebar{width:260px;background:rgba(12,12,20,0.95);backdrop-filter:blur(20px);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s;display:flex;flex-direction:column;}
.sidebar-header{padding:24px 20px;border-bottom:1px solid var(--border);}
.logo{font-family:'Space Grotesk',monospace;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
.logo-sub{font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:1px;text-transform:uppercase;}
.nav-section{padding:16px 12px;flex:1;}
.nav-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:8px 12px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:all 0.2s;font-size:14px;color:var(--text2);margin-bottom:2px;position:relative;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--blue);font-weight:500;}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--blue);border-radius:0 3px 3px 0;}
.nav-icon{width:20px;text-align:center;font-size:16px;}
.nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.nav-badge.green{background:var(--green);}.nav-badge.amber{background:var(--amber);}.nav-badge.purple{background:var(--purple);}

/* Main Content */
.main{margin-left:260px;flex:1;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(5,5,10,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:16px 32px;}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:280px;position:relative;}
.search-wrap input{width:100%;padding:12px 20px 12px 44px;background:var(--surface);border:1px solid var(--border);border-radius:100px;color:var(--text);font-size:14px;transition:all 0.2s;}
.search-wrap input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.15);}
.search-wrap .s-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text3);}
.topbar-stats{display:flex;gap:20px;font-size:13px;color:var(--text2);}
.topbar-stat{display:flex;align-items:center;gap:6px;}
.topbar-stat span{font-weight:700;color:var(--text);font-family:'Space Grotesk',monospace;}
.content{max-width:1400px;margin:0 auto;padding:32px;}

/* Hero */
.hero-section{margin-bottom:40px;}
.hero-title{font-family:'Space Grotesk',monospace;font-size:clamp(36px,5vw,56px);font-weight:800;line-height:1.1;margin-bottom:16px;}
.hero-title .gradient{background:linear-gradient(135deg,var(--blue),var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-desc{font-size:18px;color:var(--text2);max-width:600px;line-height:1.7;margin-bottom:32px;}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
.btn{padding:12px 24px;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--blue);color:#fff;}.btn-primary:hover{background:#2563eb;transform:translateY(-2px);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}

/* Stat Cards */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:40px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;transition:all 0.3s;}
.stat-card:hover{border-color:rgba(59,130,246,0.3);transform:translateY(-3px);}
.stat-card .stat-val{font-size:36px;font-weight:800;font-family:'Space Grotesk',monospace;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-card .stat-lbl{font-size:13px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}

/* Category Pills */
.cat-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px;scrollbar-width:none;}
.cat-pills::-webkit-scrollbar{display:none;}
.cat-pill{padding:8px 18px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-size:13px;cursor:pointer;white-space:nowrap;transition:all 0.2s;color:var(--text2);}
.cat-pill:hover{border-color:var(--blue);color:var(--blue);}
.cat-pill.active{background:var(--blue);border-color:var(--blue);color:#fff;}

/* Section Title */
.section-title{font-family:'Space Grotesk',monospace;font-size:24px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.section-subtitle{color:var(--text2);font-size:14px;margin-bottom:24px;}

/* Tool Cards */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:40px;}
.tool-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;transition:all 0.25s;cursor:pointer;position:relative;overflow:hidden;}
.tool-card:hover{border-color:rgba(59,130,246,0.4);transform:translateY(-4px);box-shadow:0 20px 40px -12px rgba(0,0,0,0.5);}
.tool-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--purple));opacity:0;transition:opacity 0.3s;}
.tool-card:hover::before{opacity:1;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.card-name{font-size:16px;font-weight:700;font-family:'Space Grotesk',monospace;}
.card-url{font-size:11px;color:var(--text3);margin-top:2px;}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:10px;padding:3px 10px;border-radius:40px;font-weight:600;letter-spacing:0.3px;}
.badge-free{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-pro{background:rgba(245,158,11,0.12);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.badge-paid{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.badge-cat{background:rgba(59,130,246,0.12);color:var(--blue);border:1px solid rgba(59,130,246,0.2);}
.badge-cn{background:rgba(139,92,246,0.12);color:var(--purple);border:1px solid rgba(139,92,246,0.2);}
.card-desc{font-size:13px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 12px;}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);}
.card-footer .rating{color:var(--amber);font-size:12px;font-weight:600;}
.card-footer .visit{color:var(--blue);font-size:12px;font-weight:500;text-decoration:none;display:flex;align-items:center;gap:4px;}
.card-footer .visit:hover{gap:8px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--elevated);border:1px solid var(--border);border-radius:28px;max-width:650px;width:100%;max-height:85vh;overflow-y:auto;padding:32px;position:relative;}
.modal-close{position:absolute;top:20px;right:20px;font-size:28px;cursor:pointer;color:var(--text3);background:none;border:none;}
.modal-close:hover{color:var(--text);}
.modal-name{font-size:28px;font-weight:800;font-family:'Space Grotesk',monospace;margin-bottom:8px;}
.modal-url{color:var(--text3);font-size:13px;margin-bottom:16px;}
.modal-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.modal-desc{font-size:15px;line-height:1.7;color:var(--text2);margin-bottom:20px;}
.modal-use{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.15);border-radius:16px;padding:20px;margin-bottom:20px;}
.modal-use h4{font-size:14px;color:var(--blue);margin-bottom:8px;}
.modal-use p{font-size:14px;color:var(--text2);line-height:1.6;}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.modal-stat{background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;text-align:center;}
.modal-stat .ms-val{font-size:20px;font-weight:700;font-family:'Space Grotesk',monospace;}
.modal-stat .ms-lbl{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;}
.modal-link{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:var(--blue);color:#fff;border-radius:100px;text-decoration:none;font-weight:600;font-size:14px;transition:all 0.2s;}
.modal-link:hover{background:#2563eb;transform:translateY(-2px);}

/* Google AI Page Special */
.google-hero{background:linear-gradient(135deg,rgba(59,130,246,0.08),rgba(139,92,246,0.08));border:1px solid var(--border);border-radius:24px;padding:40px;margin-bottom:40px;position:relative;overflow:hidden;}
.google-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(66,133,244,0.15),transparent 70%);pointer-events:none;}
.google-hero h1{font-size:clamp(28px,4vw,42px);font-weight:800;font-family:'Space Grotesk',monospace;margin-bottom:12px;}
.google-hero h1 span{background:linear-gradient(90deg,#4285F4,#34A853,#FBBC05,#EA4335);-webkit-background-clip:text;background-clip:text;color:transparent;}
.google-hero p{color:var(--text2);font-size:16px;max-width:600px;}

/* Filter Row */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
.filter-btn{padding:8px 16px;border-radius:40px;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
.filter-btn:hover{border-color:var(--blue);color:var(--blue);}
.filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.filter-btn .count{background:rgba(255,255,255,0.15);padding:1px 6px;border-radius:20px;font-size:10px;}
.filter-btn.active .count{background:rgba(255,255,255,0.25);}

/* Pagination */
.pagination{display:flex;justify-content:center;gap:8px;margin:40px 0;}
.page-btn{padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;transition:all 0.2s;font-size:13px;}
.page-btn:hover{border-color:var(--blue);color:var(--blue);}
.page-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.page-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* Empty State */
.empty-state{text-align:center;padding:80px 20px;color:var(--text3);}
.empty-state .es-icon{font-size:48px;margin-bottom:16px;}
.empty-state p{font-size:16px;}

/* Responsive */
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .mobile-toggle{display:flex!important;}
  .overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;}
  .overlay-bg.active{display:block;}
}
@media(max-width:768px){
  .tools-grid{grid-template-columns:1fr;}
  .modal-stats{grid-template-columns:1fr 1fr;}
  .content{padding:20px 16px;}
  .topbar{padding:12px 16px;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
}
.mobile-toggle{display:none;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:20px;position:absolute;top:16px;left:16px;z-index:101;}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.4s ease forwards;}
.fade-up:nth-child(1){animation-delay:0s}.fade-up:nth-child(2){animation-delay:0.02s}.fade-up:nth-child(3){animation-delay:0.04s}.fade-up:nth-child(4){animation-delay:0.06s}.fade-up:nth-child(5){animation-delay:0.08s}.fade-up:nth-child(6){animation-delay:0.1s}.fade-up:nth-child(7){animation-delay:0.12s}.fade-up:nth-child(8){animation-delay:0.14s}.fade-up:nth-child(9){animation-delay:0.16s}.fade-up:nth-child(10){animation-delay:0.18s}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,0.05) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Chart container */
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:40px;}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.chart-title{font-family:'Space Grotesk',monospace;font-size:18px;font-weight:700;}
.chart-controls{display:flex;gap:8px;}
.chart-btn{padding:6px 14px;border-radius:40px;background:transparent;border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:12px;transition:all 0.2s;}
.chart-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.chart-wrap{position:relative;height:350px;}
.chart-wrap canvas{max-height:100%;}

/* Google AI special card */
.google-card{background:linear-gradient(135deg,rgba(66,133,244,0.06),rgba(139,92,246,0.06));}
</style>
</head>
<body>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>

<div class="overlay-bg" id="overlayBg" onclick="closeSidebar()"></div>
<button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()">☰</button>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">AI UNIVERSE</div>
      <div class="logo-sub">All Models · One Place · 2026</div>
    </div>
    <nav class="nav-section" id="navMenu"></nav>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="search-wrap">
          <span class="s-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search 1000+ AI models by name, category, or use case...">
        </div>
        <div class="topbar-stats">
          <div class="topbar-stat">📦 Total: <span id="statTotal">0</span></div>
          <div class="topbar-stat">🆓 Free: <span id="statFree">0</span></div>
          <div class="topbar-stat">📂 Showing: <span id="statShowing">0</span></div>
        </div>
      </div>
    </header>
    <div class="content" id="mainContent"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ============================================
// DATA: ALL AI TOOLS
// ============================================
const GOOGLE_TOOLS = [
  {id:"g1",name:"Gemini",url:"gemini.google.com",cat:"chat",category:"Chat & LLM",for:"Both",desc:"Google's main AI chatbot — text, images, code, files, deep research, audio. Powered by Gemini 3 Flash/Pro/Ultra models. The hub that connects to all other Google AI tools.",use:"Write landing page copy, generate brand name ideas, debug code, create CSS animations, review designs, write API docs.",cost:"Free",costBadge:"free",detail:"Flash model unlimited; Pro needs AI Pro ($19.99/mo)",rating:4.9,context:1000000,speed:95,pricePerM:0},
  {id:"g2",name:"Gemini Canvas",url:"gemini.google.com",cat:"both",category:"Both",for:"Both",desc:"Live collaborative workspace inside Gemini — write documents and code side-by-side with AI, with real-time rendering. Like a shared whiteboard with AI editing your content live.",use:"Co-write a design brief with AI editing, build a component spec doc, prototype a React component with live preview.",cost:"Free",costBadge:"free",detail:"Available inside Gemini chat",rating:4.6,context:100000,speed:70,pricePerM:0},
  {id:"g3",name:"Stitch",url:"stitch.withgoogle.com",cat:"design",category:"Design",for:"Design",desc:"Turns text descriptions or rough sketches into polished UI designs. Exports to Figma (with layers + auto-layout) or outputs HTML/CSS/React. Powered by Gemini 3 Pro.",use:"Generate multi-screen app mockups in seconds, get past blank canvas, show clients early concepts, get first-draft component libraries.",cost:"Free",costBadge:"free",detail:"350 standard + 50 high-quality gen/mo",rating:4.8,context:0,speed:18,pricePerM:0},
  {id:"g4",name:"Mixboard",url:"mixboard.google.com",cat:"design",category:"Design",for:"Design",desc:"AI-powered infinite canvas for mood boarding. Drop images, colors, notes — AI suggests textures, complementary colors, and generated images. Google Labs experiment.",use:"Build brand identity mood boards, explore visual directions, present creative concepts with AI-expanded imagery.",cost:"Free",costBadge:"free",detail:"Labs experiment, Google account needed",rating:4.5,context:0,speed:15,pricePerM:0},
  {id:"g5",name:"GenType",url:"labs.google",cat:"design",category:"Design",for:"Design",desc:"Generate custom AI-designed alphabets and typefaces using Imagen. Type a word, choose a visual style — it creates each letter as a unique illustration. No punctuation yet.",use:"Create a distinctive one-off event identity or logotype concept, generate custom display type for a campaign, explore lettering directions.",cost:"Free",costBadge:"free",detail:"Labs experiment",rating:4.4,context:0,speed:10,pricePerM:0},
  {id:"g6",name:"Pomelli",url:"labs.google",cat:"design",category:"Design",for:"Design",desc:"AI marketing tool that learns your brand from your website URL and auto-generates on-brand social posts, ads, and product lifestyle images. Labs experiment.",use:"Generate consistent on-brand social content for clients fast, create product mockups in AI lifestyle backgrounds, produce ad variations.",cost:"Free",costBadge:"free",detail:"Labs experiment",rating:4.3,context:0,speed:12,pricePerM:0},

  {id:"g8",name:"ImageFX",url:"flow.google",cat:"creative",category:"Creative",for:"Creative",desc:"Text-to-image generation using Google's Imagen model (Nano Banana). Now integrated into Flow. Standalone version available until April 2026. SynthID watermark on all generated images.",use:"Generate brand imagery, ad concepts, blog headers, background textures, icon style explorations, mood board visuals.",cost:"Free",costBadge:"free",detail:"Moving into Flow at flow.google",rating:4.6,context:0,speed:22,pricePerM:0},
  {id:"g9",name:"Whisk",url:"flow.google",cat:"creative",category:"Creative",for:"Creative",desc:"Image remixing tool — combine a subject + scene + style image to create something entirely new. Now integrated into Flow. Being absorbed into Flow by April 2026.",use:"Blend product photos with lifestyle scenes, test visual identity variations, remix brand assets into new styles quickly.",cost:"Free",costBadge:"free",detail:"Moving into Flow — use flow.google",rating:4.5,context:0,speed:20,pricePerM:0},

    cost: ct,
    ctx: cat === "chat" || cat === "code" ? [8000,16000,32000,128000,200000,1000000][i%6] : 0,

// ============================================
// FILTERING
// ============================================
function getFiltered(){
  let tools = [...ALL_TOOLS];
  // Google AI page
  if(currentPage === "google"){
    tools = tools.filter(t => t.isGoogle);
  }
  // Category pages
  if(currentPage.startsWith("cat-")){
    const catKey = currentPage.replace("cat-","");
    const catMap = {"chat":"chat","design":"design","code":"dev","image":"image","video":"video","audio":"audio","writing":"writing","research":"research","workspace":"workspace","agent":"agent","fun":"fun","data":"data","marketing":"marketing","cloud":"cloud"};
    const targetCat = catMap[catKey];
    tools = tools.filter(t => t.cat === targetCat || t.category?.toLowerCase().includes(catKey.replace("chat","chat")));
  }
  // Cost filters
  if(currentPage === "free") tools = tools.filter(t => t.cost === "free" || t.costBadge === "free");
  if(currentPage === "pro") tools = tools.filter(t => t.cost === "pro" || t.costBadge === "pro");
  if(currentPage === "paid") tools = tools.filter(t => t.cost === "paid" || t.costBadge === "paid");
  
  // Sub-category filter
  if(currentCatFilter !== "all"){
    tools = tools.filter(t => t.cat === currentCatFilter);
  }
  // Cost sub-filter
  if(currentCostFilter !== "all"){
    if(currentCostFilter === "free") tools = tools.filter(t => t.cost === "free" || t.costBadge === "free");
    if(currentCostFilter === "pro") tools = tools.filter(t => t.cost === "pro" || t.costBadge === "pro");
    if(currentCostFilter === "paid") tools = tools.filter(t => t.cost === "paid" || t.costBadge === "paid");
  }
  
  // Search
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    tools = tools.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || (t.origin||"").toLowerCase().includes(q) || (t.category||"").toLowerCase().includes(q) || (t.use||"").toLowerCase().includes(q));
  }
  
  return tools;
}

function renderToolCard(tool, idx, isGoogle = false){
  const stars = "★".repeat(Math.floor(tool.rating)) + (tool.rating % 1 >= 0.5 ? "½" : "") + "☆".repeat(5 - Math.ceil(tool.rating));
  const catInfo = CATEGORIES[tool.cat] || {icon:"📦", name:tool.category||"AI", color:"#3b82f6"};
  return `
    <div class="tool-card fade-up ${isGoogle?'google-card':''}" onclick="showToolModal(${JSON.stringify(tool).replace(/"/g,'&quot;')})" style="animation-delay:${Math.min(idx*0.03,0.5)}s">
      <div class="card-top">
        <div>
          <div class="card-name">${tool.name}</div>
          <div class="card-url">${tool.url}${tool.origin?` · ${tool.origin}`:''}</div>
        </div>
        <div class="card-badges">
          <span class="badge badge-${tool.costBadge||tool.cost}">${tool.cost||tool.costBadge}</span>
          ${tool.isGoogle?'<span class="badge" style="background:rgba(66,133,244,0.15);color:#4285F4;border:1px solid rgba(66,133,244,0.3)">Google</span>':''}
          <span class="badge badge-cat">${catInfo.icon} ${catInfo.name}</span>
        </div>
      </div>
      <div class="card-desc">${tool.desc}</div>
      <div class="card-footer">
        <span class="rating">${stars} ${tool.rating}/5</span>
        <span class="visit">View details →</span>
      </div>
    </div>
  `;
}

function renderFilterPills(tools){
  const cats = {};
  tools.forEach(t => {
    const key = t.cat;
    if(!cats[key]) cats[key] = {count:0, info: CATEGORIES[key]||{icon:"📦",name:t.category}};
    cats[key].count++;
  });
  return `
    <div class="filter-row">
      <div class="filter-btn ${currentCatFilter==='all'?'active':''}" onclick="setCatFilter('all')">All <span class="count">${tools.length}</span></div>
      ${Object.entries(cats).map(([key,val])=>`<div class="filter-btn ${currentCatFilter===key?'active':''}" onclick="setCatFilter('${key}')">${val.info.icon} ${val.info.name} <span class="count">${val.count}</span></div>`).join('')}
    </div>
    <div class="filter-row" style="margin-top:8px">
      <div class="filter-btn ${currentCostFilter==='all'?'active':''}" onclick="setCostFilter('all')">All Prices</div>
      <div class="filter-btn ${currentCostFilter==='free'?'active':''}" onclick="setCostFilter('free')">✓ Free</div>
      <div class="filter-btn ${currentCostFilter==='pro'?'active':''}" onclick="setCostFilter('pro')">💎 Freemium</div>
      <div class="filter-btn ${currentCostFilter==='paid'?'active':''}" onclick="setCostFilter('paid')">💰 Paid</div>
    </div>
  `;
}

function setCatFilter(f){currentCatFilter=f;page=1;renderContent();}
function setCostFilter(f){currentCostFilter=f;page=1;renderContent();}

function renderPagination(total){
  if(total <= 1) return '';
  let btns = '';
  btns += `<button class="page-btn" ${page===1?'disabled':''} onclick="goPage(${page-1})">←</button>`;
  const maxShow = 7;
  let startP = Math.max(1, page - 3);
  let endP = Math.min(total, startP + maxShow - 1);
  if(endP - startP < maxShow - 1) startP = Math.max(1, endP - maxShow + 1);
  if(startP > 1) btns += `<button class="page-btn" onclick="goPage(1)">1</button>${startP>2?'<span style="color:var(--text3)">…</span>':''}`;
  for(let i = startP; i <= endP; i++) btns += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if(endP < total) btns += `${endP<total-1?'<span style="color:var(--text3)">…</span>':''}<button class="page-btn" onclick="goPage(${total})">${total}</button>`;
  btns += `<button class="page-btn" ${page===total?'disabled':''} onclick="goPage(${page+1})">→</button>`;
  return `<div class="pagination">${btns}</div>`;
}

function goPage(p){page=p;renderContent();window.scrollTo({top:0,behavior:'smooth'});}

function renderChartSection(){

          <button class="chart-btn" onclick="updateChart('spd',this)">⚡ Speed</button>

      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>

  `;
}

// ============================================
// CHART
// ============================================
let mainChart = null;
function updateChart(metric, btn){
  document.querySelectorAll('.chart-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(!mainChart) return;
  const tools = [...ALL_TOOLS].sort((a,b)=>b.rating-a.rating).slice(0,25);
  let data, label;
  if(metric==='rating'){data=tools.map(t=>t.rating);label="Rating (/5)";}
  else if(metric==='ctx'){data=tools.filter(t=>t.ctx>0).map(t=>t.ctx/1000);tools.length>25;label="Context (K tokens)";}
  else{data=tools.filter(t=>t.spd>0).map(t=>t.spd);label="Speed (tokens/s)";}
  const colors = tools.map(t=>{
    if(t.isGoogle) return '#4285F4';
    if(t.cost==='free'||t.costBadge==='free') return '#10b981';
    if(t.cost==='pro'||t.costBadge==='pro') return '#f59e0b';
    return '#ef4444';
  });
  mainChart.data.labels = tools.map(t=>t.name.length>18?t.name.slice(0,15)+'…':t.name);
  mainChart.data.datasets[0].data = data;
  mainChart.data.datasets[0].backgroundColor = colors;
  mainChart.update();
}

function initChart(){
  const canvas = document.getElementById('mainChart');
  if(!canvas) return;
  mainChart = new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{labels:[],datasets:[{label:'',data:[],backgroundColor:[],borderRadius:8,maxBarThickness:30}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{tooltip:{callbacks:{label:ctx=>`${ctx.raw} ${ctx.dataset.label}`}},legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#a1a1aa'}},x:{ticks:{maxRotation:45,font:{size:10},color:'#a1a1aa'}}}}
  });
  const tools = [...ALL_TOOLS].sort((a,b)=>b.rating-a.rating).slice(0,25);
  mainChart.data.labels = tools.map(t=>t.name.length>18?t.name.slice(0,15)+'…':t.name);
  mainChart.data.datasets[0].data = tools.map(t=>t.rating);
  mainChart.data.datasets[0].backgroundColor = tools.map(t=>{if(t.isGoogle)return'#4285F4';if(t.cost==='free'||t.costBadge==='free')return'#10b981';if(t.cost==='pro'||t.costBadge==='pro')return'#f59e0b';return'#ef4444';});
  mainChart.update();
}
