function getFiltered(){
  var tools=ALL_TOOLS.slice();
  if(curPage==="google")tools=tools.filter(function(t){return t.isGoogle;});
  else if(curPage==="top10")tools=tools.slice().sort(function(a,b){return b.rating-a.rating;}).slice(0,10);
  else if(curPage==="ffree")tools=tools.filter(function(t){return t.cost==="free";});
  else if(curPage==="fpaid")tools=tools.filter(function(t){return t.cost==="paid";});
  else if(curPage==="ftrial")tools=tools.filter(function(t){return t.cost==="trial";});
  else if(curPage!=="all")tools=tools.filter(function(t){return t.cat===curPage;});
  if(sq){
    var q=sq.toLowerCase();
    tools=tools.filter(function(t){
      return t.name.toLowerCase().indexOf(q)!==-1||t.desc.toLowerCase().indexOf(q)!==-1||(t.origin||"").toLowerCase().indexOf(q)!==-1||t.category.toLowerCase().indexOf(q)!==-1||(t.use||"").toLowerCase().indexOf(q)!==-1;
    });
  }
  return tools;
}

  return h;
}

// ============================================
// CHART
// ============================================
function uc(metric,btn){
  document.querySelectorAll('.ch-btn').forEach(function(b){b.classList.remove('on');});
  if(btn)btn.classList.add('on');
  if(!mChart)return;
  var tools=ALL_TOOLS.slice().sort(function(a,b){return b.rating-a.rating;}).slice(0,18);
  var data=[],lbl="";
  if(metric==="rating"){data=tools.map(function(t){return t.rating;});lbl="Rating (/5)";}
  else if(metric==="ctx"){data=tools.filter(function(t){return t.ctx>0;}).slice(0,18).map(function(t){return t.ctx/1000;});lbl="Context (K)";}
  else{data=tools.filter(function(t){return t.spd>0;}).slice(0,18).map(function(t){return t.spd;});lbl="Speed (t/s)";}
  var colors=tools.map(function(t){if(t.isGoogle)return'#4285F4';if(t.cost==='free')return'#10b981';if(t.cost==='trial')return'#f59e0b';return'#ef4444';});
  mChart.data.labels=tools.map(function(t){return t.name.length>20?t.name.slice(0,18)+'…':t.name;});
  mChart.data.datasets[0].data=data;
  mChart.data.datasets[0].backgroundColor=colors;
  mChart.update();
}

function initChart(){
  var c=document.getElementById('mc2');if(!c)return;
  if(mChart)mChart.destroy();
  var tools=ALL_TOOLS.slice().sort(function(a,b){return b.rating-a.rating;}).slice(0,18);
  var colors=tools.map(function(t){if(t.isGoogle)return'#4285F4';if(t.cost==='free')return'#10b981';if(t.cost==='trial')return'#f59e0b';return'#ef4444';});
  mChart=new Chart(c.getContext('2d'),{
    type:'bar',
    data:{labels:tools.map(function(t){return t.name.length>20?t.name.slice(0,18)+'…':t.name;}),datasets:[{label:'Rating',data:tools.map(function(t){return t.rating;}),backgroundColor:colors,borderRadius:5,maxBarThickness:26}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{tooltip:{callbacks:{label:function(ctx){return ctx.raw+' / 5.0';}}},legend:{display:false}},scales:{y:{beginAtZero:true,max:5,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#a1a1aa',stepSize:1}},x:{ticks:{maxRotation:45,font:{size:9},color:'#a1a1aa'}}}}
  });
}

function sm(tool){
  var ci=rc(tool);
  var cl=COST_LABELS[tool.cost]||"Free";
  var cc=tool.cost==="free"?"fr":tool.cost==="paid"?"pd":"tr";
  var body=document.getElementById('mbody');
  body.innerHTML='<h2>'+tool.name+'</h2><div class="mu">'+tool.url+' · '+(tool.origin||'Unknown')+'</div><div class="mb"><span class="bg bg-'+cc+'">'+cl+'</span>'+(tool.isGoogle?'<span class="bg bg-gl">🔵 Google AI</span>':'')+'<span class="bg bg-ct">'+ci.i+' '+ci.n+'</span></div><div class="md">'+tool.desc+'</div><div class="mu-box"><h4>✨ How to Use This Tool</h4><p>'+(tool.use||'Explore this tool for your workflow.')+'</p></div><div class="ms"><div class="ms-i"><div class="v" style="color:var(--amber)">⭐ '+tool.rating+'</div><div class="l">Rating</div></div><div class="ms-i"><div class="v">'+(tool.ctx>0?(tool.ctx>=1000000?(tool.ctx/1000000).toFixed(1)+'M':(tool.ctx/1000).toFixed(0)+'K'):'—')+'</div><div class="l">Context</div></div><div class="ms-i"><div class="v">'+(tool.spd>0?tool.spd+'/s':'—')+'</div><div class="l">Speed</div></div><div class="ms-i"><div class="v">'+(tool.cost==='free'?'$0':tool.price>0?'$'+tool.price+'/mo':'$'+tool.price+'/mo')+'</div><div class="l">Price</div></div></div><div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:12px;margin-bottom:14px;font-size:11px;color:var(--text2)">'+(tool.detail||'')+'</div><a href="https://'+tool.url+'" target="_blank" class="ml">🌐 Visit '+tool.url+' →</a>';
  document.getElementById('mbg').classList.add('on');
}
function cm(){document.getElementById('mbg').classList.remove('on');}
