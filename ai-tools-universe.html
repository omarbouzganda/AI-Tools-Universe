*{margin:0;padding:0;box-sizing:border-box;}

body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.6;overflow-x:hidden;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px;}
.orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:0.12;pointer-events:none;z-index:0;}
.orb-1{width:50vw;height:50vw;background:var(--blue);top:-15%;right:-10%;animation:floatA 30s infinite alternate;}
.orb-2{width:45vw;height:45vw;background:var(--purple);bottom:-15%;left:-10%;animation:floatA 25s infinite alternate;}
.orb-3{width:35vw;height:35vw;background:var(--cyan);top:35%;left:40%;animation:floatA 35s infinite alternate;}

.app{display:flex;min-height:100vh;position:relative;z-index:1;}
.sidebar{width:270px;background:rgba(10,10,18,0.97);backdrop-filter:blur(20px);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s;display:flex;flex-direction:column;}
.sidebar-header{padding:24px 20px;border-bottom:1px solid var(--border);text-align:center;}
.logo{font-family:'Space Grotesk',monospace;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
.logo-sub{font-size:10px;color:var(--text3);margin-top:4px;letter-spacing:1.5px;text-transform:uppercase;}
.nav-section{padding:12px 10px;flex:1;}
.nav-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;padding:12px 14px 6px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:all 0.2s;font-size:13px;color:var(--text2);margin-bottom:1px;position:relative;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--blue);font-weight:600;}

.nav-icon{width:22px;text-align:center;font-size:15px;}
.nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;}
.nav-badge.green{background:var(--green);}
.nav-badge.amber{background:var(--amber);}
.nav-badge.purple{background:var(--purple);}
.nav-badge.red{background:var(--red);}
.main{margin-left:270px;flex:1;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(5,5,10,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 28px;}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:260px;position:relative;}
.search-wrap input{width:100%;padding:12px 20px 12px 42px;background:var(--surface);border:1px solid var(--border);border-radius:100px;color:var(--text);font-size:14px;transition:all 0.2s;}
.search-wrap input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.12);}
.search-wrap .s-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3);}
.topbar-stats{display:flex;gap:18px;font-size:12px;color:var(--text2);}
.topbar-stat{display:flex;align-items:center;gap:5px;}
.topbar-stat span{font-weight:700;color:var(--text);font-family:'Space Grotesk',monospace;}
.content{max-width:1400px;margin:0 auto;padding:28px;}
.hero-section{margin-bottom:32px;}
.hero-title{font-family:'Space Grotesk',monospace;font-size:clamp(28px,4.5vw,48px);font-weight:800;line-height:1.15;margin-bottom:12px;}
.hero-title .gradient{background:linear-gradient(135deg,var(--blue),var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-desc{font-size:16px;color:var(--text2);max-width:600px;line-height:1.7;margin-bottom:24px;}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;transition:all 0.3s;}
.stat-card:hover{border-color:rgba(59,130,246,0.3);transform:translateY(-2px);}
.stat-card .stat-val{font-size:32px;font-weight:800;font-family:'Space Grotesk',monospace;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-card .stat-lbl{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
.section-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.section-title{font-family:'Space Grotesk',monospace;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;}
.section-count{font-size:13px;color:var(--text3);background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:20px;}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:32px;}
.tool-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;transition:all 0.25s;cursor:pointer;position:relative;overflow:hidden;}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-name{font-size:15px;font-weight:700;font-family:'Space Grotesk',monospace;}

.card-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}

.badge-free{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.25);}
.badge-paid{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.25);}
.badge-trial{background:rgba(245,158,11,0.12);color:var(--amber);border:1px solid rgba(245,158,11,0.25);}
.badge-cat{background:rgba(59,130,246,0.1);color:var(--blue);border:1px solid rgba(59,130,246,0.2);}
.badge-google{background:rgba(66,133,244,0.12);color:#4285F4;border:1px solid rgba(66,133,244,0.3);}
.badge-top10{background:rgba(255,215,0,0.15);color:var(--gold);border:1px solid rgba(255,215,0,0.4);}
.card-desc{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 10px;}

.card-footer .rating{color:var(--amber);font-size:11px;font-weight:600;}
.card-footer .origin{font-size:10px;color:var(--text3);}
.google-card{background:linear-gradient(135deg,rgba(66,133,244,0.05),rgba(139,92,246,0.04));}
.google-card::before{background:linear-gradient(90deg,#4285F4,#34A853,#FBBC05,#EA4335);}

.pagination{display:flex;justify-content:center;gap:6px;margin:32px 0;}
.page-btn{padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;transition:all 0.2s;font-size:12px;}
.page-btn:hover{border-color:var(--blue);color:var(--blue);}
.page-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.page-btn:disabled{opacity:0.3;cursor:not-allowed;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--elevated);border:1px solid var(--border);border-radius:24px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;padding:28px;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;font-size:24px;cursor:pointer;color:var(--text3);background:none;border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.modal-close:hover{background:rgba(255,255,255,0.1);color:var(--text);}
.modal-name{font-size:24px;font-weight:800;font-family:'Space Grotesk',monospace;margin-bottom:6px;padding-right:40px;}
.modal-url{color:var(--text3);font-size:12px;margin-bottom:14px;}

.modal-desc{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:16px;}

.modal-use h4{font-size:13px;color:var(--blue);margin-bottom:6px;}
.modal-use p{font-size:13px;color:var(--text2);line-height:1.6;}

.modal-link:hover{background:#2563eb;transform:translateY(-2px);}

.empty-state .es-icon{font-size:42px;margin-bottom:12px;}
.empty-state p{font-size:15px;}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px;}

.chart-title{font-family:'Space Grotesk',monospace;font-size:16px;font-weight:700;}
.chart-controls{display:flex;gap:6px;}

.chart-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}

.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99;}
.overlay-bg.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.35s ease forwards;opacity:0;}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .mobile-toggle{display:flex!important;}

@media(max-width:768px){
  .tools-grid{grid-template-columns:1fr;}
  .modal-stats{grid-template-columns:repeat(2,1fr);}
  .content{padding:16px;}
  .topbar{padding:10px 14px;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

function navigate(pageId){
  currentPage = pageId;

  searchQuery = "";

  window.scrollTo({top:0,behavior:'smooth'});
}

  document.getElementById("sidebar").classList.toggle("open");

// FILTERING
// ============================================
function getFiltered(){
  let tools = [...ALL_TOOLS];

  if(currentPage === "google") tools = tools.filter(t => t.isGoogle);
  else if(currentPage === "top10") tools = [...ALL_TOOLS].sort((a,b)=>b.rating-a.rating).slice(0,10);
  else if(currentPage === "filter-free") tools = tools.filter(t => t.cost === "free");
  else if(currentPage === "filter-paid") tools = tools.filter(t => t.cost === "paid");
  else if(currentPage === "filter-trial") tools = tools.filter(t => t.cost === "trial");
  else if(currentPage !== "all") tools = tools.filter(t => t.cat === currentPage);

  if(searchQuery){
    const q = searchQuery.toLowerCase();
    tools = tools.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      (t.origin||"").toLowerCase().includes(q) ||
      (t.category||"").toLowerCase().includes(q) ||
      (t.use||"").toLowerCase().includes(q)
    );
  }

  return tools;
}

  const content = document.getElementById("mainContent");
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const start = (page - 1) * PAGE_SIZE;
  const pageTools = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById("statTotal").textContent = ALL_TOOLS.length;
  document.getElementById("statFree").textContent = ALL_TOOLS.filter(t=>t.cost==="free").length;
  document.getElementById("statShowing").textContent = filtered.length;

  let html = "";

  if(currentPage === "all"){
    html = renderHomePage(filtered);
  } else if(currentPage === "google"){
    html = renderGooglePage(filtered, totalPages);
  } else if(currentPage === "top10"){
    html = renderTop10Page(filtered);
  } else if(currentPage.startsWith("filter-")){
    html = renderFilterPage(filtered, totalPages);
  } else {
    html = renderCategoryPage(filtered, totalPages);
  }

  content.innerHTML = html;
  if(currentPage === "all" || currentPage === "google") setTimeout(initChart, 100);
}

let pageTools = [];
function startNum(){return(page-1)*PAGE_SIZE+1;}
function endNum(total){return Math.min(page*PAGE_SIZE,total);}

function renderToolCard(tool, idx, isHighlight=false){
  const costLabel = COST_LABELS[tool.cost] || "Free";
  const costClass = tool.cost === "free" ? "free" : tool.cost === "paid" ? "paid" : "trial";
  const stars = "★".repeat(Math.floor(tool.rating)) + (tool.rating%1>=0.5?"½":"") + "☆".repeat(5-Math.ceil(tool.rating));
  const catInfo = CATEGORIES[tool.cat] || {icon:"📦",name:tool.category||"AI"};
  const cardClass = tool.isGoogle ? "tool-card google-card" : isHighlight ? "tool-card top10-card" : "tool-card";
  const rank = isHighlight && currentPage === "top10" ? idx + 1 : null;

  return `
    <div class="${cardClass} fade-up" onclick="showToolModal(${JSON.stringify(tool).replace(/"/g,'&quot;')})" style="animation-delay:${Math.min(idx*0.03,0.5)}s">
      ${rank?`<div style="position:absolute;top:8px;left:8px;background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,165,0,0.1));border:1px solid rgba(255,215,0,0.3);border-radius:20px;padding:2px 8px;font-size:10px;color:var(--gold);font-weight:800;">#${rank}</div>`:''}
      <div class="card-top">
        <div>
          <div class="card-name">${tool.name}</div>
          <div class="card-url">${tool.url}</div>
        </div>
        <div class="card-badges">
          <span class="badge badge-${costClass}">${costLabel}</span>
          ${tool.isGoogle?'<span class="badge badge-google">Google</span>':''}
          <span class="badge badge-cat">${catInfo.icon} ${catInfo.name}</span>
        </div>
      </div>
      <div class="card-desc">${tool.desc}</div>
      <div class="card-footer">
        <span class="rating">${stars} ${tool.rating}/5</span>
        <span class="origin">${tool.origin||''}</span>
      </div>
    </div>
  `;
}

function renderPagination(total){
  if(total <= 1) return '';
  let btns = `<button class="page-btn" ${page===1?'disabled':''} onclick="goPage(${page-1})">← Prev</button>`;
  const maxShow = 5;
  let startP = Math.max(1, page - 2);
  let endP = Math.min(total, startP + maxShow - 1);
  if(endP - startP < maxShow - 1) startP = Math.max(1, endP - maxShow + 1);
  for(let i = startP; i <= endP; i++) btns += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  btns += `<button class="page-btn" ${page===total?'disabled':''} onclick="goPage(${page+1})">Next →</button>`;
  return `<div class="pagination">${btns}</div>`;
}

function goPage(p){page=p;renderContent();window.scrollTo({top:0,behavior:'smooth'});}

function renderChartSection(){
  return `
    <div class="chart-container fade-up">
      <div class="chart-header">
        <div class="chart-title">📊 Top AI Models — Performance Overview</div>
        <div class="chart-controls">
          <button class="chart-btn active" onclick="updateChart('rating',this)">⭐ Rating</button>
          <button class="chart-btn" onclick="updateChart('ctx',this)">📝 Context</button>
          <button class="chart-btn" onclick="updateChart('spd',this)">⚡ Speed</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    </div>
  `;
}

// ============================================
// CHART
// ============================================
let mainChart = null;
function updateChart(metric, btn){
  document.querySelectorAll('.chart-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(!mainChart) return;
  const tools = [...ALL_TOOLS].sort((a,b)=>b.rating-a.rating).slice(0,20);
  let data, label;
  if(metric==='rating'){data=tools.map(t=>t.rating);label="Rating (/5)";}
  else if(metric==='ctx'){data=tools.filter(t=>t.ctx>0).slice(0,20).map(t=>t.ctx/1000);label="Context (K)";}
  else{data=tools.filter(t=>t.spd>0).slice(0,20).map(t=>t.spd);label="Speed (t/s)";}
  const colors = tools.map(t=>{if(t.isGoogle)return'#4285F4';if(t.cost==='free')return'#10b981';if(t.cost==='trial')return'#f59e0b';return'#ef4444';});
  mainChart.data.labels = tools.map(t=>t.name.length>20?t.name.slice(0,18)+'…':t.name);
  mainChart.data.datasets[0].data = data;
  mainChart.data.datasets[0].backgroundColor = colors;
  mainChart.update();
}

function initChart(){
  const canvas = document.getElementById('mainChart');
  if(!canvas) return;
  if(mainChart) mainChart.destroy();
  const tools = [...ALL_TOOLS].sort((a,b)=>b.rating-a.rating).slice(0,20);
  mainChart = new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{labels:tools.map(t=>t.name.length>20?t.name.slice(0,18)+'…':t.name),datasets:[{label:'Rating (/5)',data:tools.map(t=>t.rating),backgroundColor:tools.map(t=>{if(t.isGoogle)return'#4285F4';if(t.cost==='free')return'#10b981';if(t.cost==='trial')return'#f59e0b';return'#ef4444';}),borderRadius:6,maxBarThickness:28}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{tooltip:{callbacks:{label:ctx=>`${ctx.raw} / 5.0`}},legend:{display:false}},scales:{y:{beginAtZero:true,max:5,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#a1a1aa',stepSize:1}},x:{ticks:{maxRotation:45,font:{size:9},color:'#a1a1aa'}}}}
  });
}

function showToolModal(tool){
  const modal = document.getElementById("modalOverlay");

  const catInfo = CATEGORIES[tool.cat] || {icon:"📦",name:tool.category||"AI"};
  const costLabel = COST_LABELS[tool.cost] || "Free";
  const costClass = tool.cost === "free" ? "free" : tool.cost === "paid" ? "paid" : "trial";
  body.innerHTML = `
    <div class="modal-name">${tool.name}</div>
    <div class="modal-url">${tool.url} · ${tool.origin||'Unknown'}</div>
    <div class="modal-badges">
      <span class="badge badge-${costClass}">${costLabel}</span>
      ${tool.isGoogle?'<span class="badge badge-google">🔵 Google AI</span>':''}
      <span class="badge badge-cat">${catInfo.icon} ${catInfo.name}</span>
    </div>
    <div class="modal-desc">${tool.desc}</div>
    <div class="modal-use">
      <h4>✨ How to Use This Tool</h4>
      <p>${tool.use || 'Explore this tool for your workflow.'}</p>
    </div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="ms-val" style="color:var(--amber)">⭐ ${tool.rating}</div><div class="ms-lbl">Rating</div></div>
      <div class="modal-stat"><div class="ms-val">${tool.ctx>0?(tool.ctx>=1000000?(tool.ctx/1000000).toFixed(1)+'M':(tool.ctx/1000).toFixed(0)+'K'):'—'}</div><div class="ms-lbl">Context</div></div>
      <div class="modal-stat"><div class="ms-val">${tool.spd>0?tool.spd+'/s':'—'}</div><div class="ms-lbl">Speed</div></div>
      <div class="modal-stat"><div class="ms-val">${tool.cost==='free'?'$0':tool.price>0?'$'+tool.price+'/mo':'$'+tool.price+'/mo'}</div><div class="ms-lbl">Price</div></div>
    </div>
    <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:14px;margin-bottom:18px;font-size:12px;color:var(--text2)">${tool.detail||''}</div>
    <a href="https://${tool.url}" target="_blank" class="modal-link">🌐 Visit ${tool.url} →</a>
  `;
  modal.classList.add("active");
}
function closeModal(){document.getElementById("modalOverlay").classList.remove("active");}
