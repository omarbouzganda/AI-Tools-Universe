<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="Discover 1000+ AI models in one peaceful, glass-morphism directory. Filter, compare, and find the perfect AI tool for your needs.">
<title>AI Universe 2026 — All AI Models in One Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<style>
/* ============= CSS VARIABLES & BASE ============= */
:root {
  /* Base colors - peaceful natural palette */
  --bg-primary: #0a0a0f;
  --bg-secondary: #0f0f1a;
  --bg-tertiary: #141424;
  --bg-glass: rgba(20, 20, 36, 0.65);
  --bg-glass-hover: rgba(30, 30, 50, 0.75);
  
  /* Borders & effects */
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(99, 102, 241, 0.4);
  --glass-border: rgba(255, 255, 255, 0.12);
  --blur-strength: 24px;
  
  /* Text colors */
  --text-primary: #ffffff;
  --text-secondary: #c7c7d6;
  --text-tertiary: #8a8a9e;
  --text-muted: #5a5a72;
  
  /* Accent colors - natural & calming */
  --accent-blue: #6366f1;
  --accent-blue-soft: rgba(99, 102, 241, 0.15);
  --accent-purple: #a78bfa;
  --accent-purple-soft: rgba(167, 139, 250, 0.12);
  --accent-teal: #2dd4bf;
  --accent-teal-soft: rgba(45, 212, 191, 0.12);
  --accent-emerald: #34d399;
  --accent-emerald-soft: rgba(52, 211, 153, 0.12);
  --accent-amber: #fbbf24;
  --accent-amber-soft: rgba(251, 191, 36, 0.12);
  --accent-rose: #f472b6;
  --accent-rose-soft: rgba(244, 114, 182, 0.12);
  --accent-gold: #fcd34d;
  
  /* Gradients */
  --gradient-primary: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-teal));
  --gradient-glass: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  --gradient-google: linear-gradient(135deg, #4285F4, #34A853, #FBBC05, #EA4335);
  
  /* Shadows */
  --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.25);
  --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.45);
  
  /* Spacing & sizing */
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-full: 999px;
  
  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms cubic-bezier(0.16, 1, 0.3, 1);
  
  /* Layout */
  --sidebar-width: 280px;
  --content-max: 1440px;
  --header-height: 72px;
}

/* Dark mode enhancements */
@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #08080d;
    --bg-secondary: #0d0d16;
  }
}

/* Reduced motion preference */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============= RESET & BASE STYLES ============= */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Custom scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.25);
}

/* Selection */
::selection {
  background: var(--accent-blue-soft);
  color: var(--text-primary);
}

/* ============= BACKGROUND ORBS (Peaceful Animation) ============= */
.orb-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.08;
  animation: float 45s infinite ease-in-out;
  will-change: transform;
}

.orb-1 {
  width: 60vw;
  height: 60vw;
  background: var(--accent-blue);
  top: -20%;
  right: -10%;
  animation-delay: 0s;
}

.orb-2 {
  width: 50vw;
  height: 50vw;
  background: var(--accent-purple);
  bottom: -15%;
  left: -5%;
  animation-delay: -15s;
}

.orb-3 {
  width: 40vw;
  height: 40vw;
  background: var(--accent-teal);
  top: 40%;
  left: 30%;
  animation-delay: -30s;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(2%, 3%) scale(1.05); }
  50% { transform: translate(-1%, 2%) scale(0.98); }
  75% { transform: translate(3%, -2%) scale(1.02); }
}

/* ============= APP LAYOUT ============= */
.app {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ============= SIDEBAR ============= */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-glass);
  backdrop-filter: blur(var(--blur-strength));
  -webkit-backdrop-filter: blur(var(--blur-strength));
  border-right: 1px solid var(--glass-border);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 100;
  transition: transform var(--transition-normal);
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 28px 24px;
  border-bottom: 1px solid var(--border-subtle);
  text-align: center;
  flex-shrink: 0;
}

.logo {
  font-family: 'Space Grotesk', monospace;
  font-size: 22px;
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}

.logo-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 6px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 500;
}

.nav-section {
  padding: 16px 12px;
  flex: 1;
  overflow-y: auto;
}

.nav-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 16px 18px 8px;
  font-weight: 700;
  opacity: 0.8;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 4px;
  position: relative;
  font-weight: 500;
}

.nav-item:hover {
  background: var(--bg-glass-hover);
  color: var(--text-primary);
  transform: translateX(2px);
}

.nav-item.active {
  background: var(--accent-blue-soft);
  color: var(--accent-blue);
  font-weight: 600;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 65%;
  background: var(--gradient-primary);
  border-radius: 0 4px 4px 0;
}

.nav-icon {
  width: 24px;
  text-align: center;
  font-size: 16px;
  flex-shrink: 0;
}

.nav-badge {
  margin-left: auto;
  background: var(--accent-blue);
  color: #fff;
  font-size: 10px;
  padding: 3px 9px;
  border-radius: var(--radius-full);
  font-weight: 700;
  min-width: 24px;
  text-align: center;
}

.nav-badge.green { background: var(--accent-emerald); }
.nav-badge.amber { background: var(--accent-amber); color: #1a1a2e; }
.nav-badge.purple { background: var(--accent-purple); }
.nav-badge.rose { background: var(--accent-rose); }

/* ============= MAIN CONTENT AREA ============= */
.main {
  margin-left: var(--sidebar-width);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============= TOP BAR ============= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg-glass);
  backdrop-filter: blur(var(--blur-strength));
  -webkit-backdrop-filter: blur(var(--blur-strength));
  border-bottom: 1px solid var(--glass-border);
  padding: 16px 32px;
  height: var(--header-height);
  display: flex;
  align-items: center;
}

.topbar-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  width: 100%;
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}

.search-wrap {
  flex: 1;
  min-width: 240px;
  max-width: 560px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  color: var(--text-primary);
  font-size: 15px;
  transition: all var(--transition-fast);
  font-family: inherit;
}

.search-wrap input::placeholder {
  color: var(--text-tertiary);
}

.search-wrap input:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 4px var(--accent-blue-soft);
  background: var(--bg-secondary);
}

.search-wrap .s-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--text-tertiary);
  pointer-events: none;
}

.topbar-stats {
  display: flex;
  gap: 24px;
  font-size: 13px;
  color: var(--text-tertiary);
  flex-wrap: wrap;
}

.topbar-stat {
  display: flex;
  align-items: center;
  gap: 6px;
}

.topbar-stat span {
  font-weight: 700;
  color: var(--text-primary);
  font-family: 'Space Grotesk', monospace;
  font-size: 14px;
}

/* ============= CONTENT AREA ============= */
.content {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 32px;
  width: 100%;
  flex: 1;
}

/* ============= HERO SECTION ============= */
.hero-section {
  margin-bottom: 40px;
  animation: fadeInUp 0.5s ease forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-title {
  font-family: 'Space Grotesk', monospace;
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}

.hero-title .gradient {
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-desc {
  font-size: 17px;
  color: var(--text-secondary);
  max-width: 640px;
  line-height: 1.7;
  margin-bottom: 28px;
}

/* ============= STATS ROW ============= */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 36px;
}

.stat-card {
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 24px 20px;
  text-align: center;
  transition: all var(--transition-normal);
  backdrop-filter: blur(12px);
}

.stat-card:hover {
  border-color: var(--border-focus);
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}

.stat-card .stat-val {
  font-size: 36px;
  font-weight: 800;
  font-family: 'Space Grotesk', monospace;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1;
}

.stat-card .stat-lbl {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

/* ============= SECTION HEADER ============= */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin: 48px 0 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.section-title {
  font-family: 'Space Grotesk', monospace;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-primary);
}

.section-count {
  font-size: 13px;
  color: var(--text-tertiary);
  background: var(--bg-tertiary);
  padding: 6px 16px;
  border-radius: var(--radius-full);
  font-weight: 500;
}

/* ============= TOOLS GRID ============= */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.tool-card {
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 22px;
  transition: all var(--transition-normal);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  min-height: 220px;
}

.tool-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--gradient-primary);
  opacity: 0;
  transition: opacity var(--transition-fast);
}

.tool-card:hover {
  border-color: var(--border-focus);
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  background: var(--bg-glass-hover);
}

.tool-card:hover::before {
  opacity: 1;
}

.tool-card.google-card {
  background: linear-gradient(135deg, rgba(66,133,244,0.06), rgba(167,139,250,0.04));
  border-color: rgba(99, 102, 241, 0.25);
}

.tool-card.google-card::before {
  background: var(--gradient-google);
}

.tool-card.top10-card {
  background: linear-gradient(135deg, rgba(252,211,77,0.06), rgba(244,114,182,0.04));
  border-color: rgba(252, 211, 77, 0.3);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
  gap: 12px;
}

.card-name {
  font-size: 16px;
  font-weight: 700;
  font-family: 'Space Grotesk', monospace;
  color: var(--text-primary);
  line-height: 1.3;
}

.card-url {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
  font-family: monospace;
  opacity: 0.9;
}

.card-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
  flex-shrink: 0;
}

.badge {
  font-size: 10px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-weight: 700;
  letter-spacing: 0.3px;
  white-space: nowrap;
  border: 1px solid transparent;
}

.badge-free {
  background: var(--accent-emerald-soft);
  color: var(--accent-emerald);
  border-color: rgba(52, 211, 153, 0.3);
}

.badge-paid {
  background: var(--accent-rose-soft);
  color: var(--accent-rose);
  border-color: rgba(244, 114, 182, 0.3);
}

.badge-trial {
  background: var(--accent-amber-soft);
  color: #b45309;
  border-color: rgba(251, 191, 36, 0.4);
}

.badge-cat {
  background: var(--accent-blue-soft);
  color: var(--accent-blue);
  border-color: rgba(99, 102, 241, 0.3);
}

.badge-google {
  background: rgba(66, 133, 244, 0.15);
  color: #4285F4;
  border-color: rgba(66, 133, 244, 0.4);
}

.card-desc {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 8px 0 16px;
  flex: 1;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
  margin-top: auto;
}

.card-footer .rating {
  color: var(--accent-amber);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-footer .origin {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 500;
}

/* ============= GOOGLE HERO ============= */
.google-hero {
  background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(167,139,250,0.06));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 36px;
  margin-bottom: 36px;
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.5s ease forwards;
}

.google-hero::before {
  content: '';
  position: absolute;
  top: -40%;
  right: -15%;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(66,133,244,0.15), transparent 70%);
  pointer-events: none;
  animation: pulse 8s infinite ease-in-out;
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.1); }
}

.google-hero h1 {
  font-size: clamp(24px, 4vw, 40px);
  font-weight: 800;
  font-family: 'Space Grotesk', monospace;
  margin-bottom: 12px;
  line-height: 1.2;
}

.google-hero h1 span {
  background: var(--gradient-google);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.google-hero p {
  color: var(--text-secondary);
  font-size: 15px;
  max-width: 520px;
  line-height: 1.6;
}

/* ============= TOP 10 BADGE ============= */
.top10-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, rgba(252,211,77,0.15), rgba(244,114,182,0.1));
  border: 1px solid rgba(252, 211, 77, 0.4);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 11px;
  color: var(--accent-gold);
  font-weight: 700;
  margin-bottom: 20px;
  animation: fadeInUp 0.5s ease forwards;
}

/* ============= CHART SECTION ============= */
.chart-container {
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 32px;
  backdrop-filter: blur(12px);
  animation: fadeInUp 0.5s ease forwards;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.chart-title {
  font-family: 'Space Grotesk', monospace;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
}

.chart-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.chart-btn {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-tertiary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: all var(--transition-fast);
  font-family: inherit;
}

.chart-btn:hover {
  border-color: var(--border-focus);
  color: var(--text-primary);
  background: var(--bg-tertiary);
}

.chart-btn.active {
  background: var(--accent-blue);
  border-color: var(--accent-blue);
  color: #fff;
}

.chart-wrap {
  position: relative;
  height: 300px;
}

.chart-wrap canvas {
  max-height: 100%;
}

/* ============= PAGINATION ============= */
.pagination {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 40px 0;
  flex-wrap: wrap;
}

.page-btn {
  padding: 10px 16px;
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  min-width: 44px;
}

.page-btn:hover:not(:disabled) {
  border-color: var(--border-focus);
  color: var(--accent-blue);
  background: var(--bg-glass-hover);
  transform: translateY(-2px);
}

.page-btn.active {
  background: var(--accent-blue);
  border-color: var(--accent-blue);
  color: #fff;
  font-weight: 600;
}

.page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

/* ============= MODAL ============= */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 12, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 1000;

function generateTools() {
  // Start with Google tools
  const tools = [...GOOGLE_TOOLS.map(t => ({ ...t, isGoogle: true }))];
  
  // Category distribution for generated tools
  const CAT_DIST = {
    chat: 95, design: 75, code: 105, image: 90, video: 85, 
    audio: 70, writing: 65, research: 60, workspace: 55, 
    agent: 65, data: 80, marketing: 50, cloud: 70, fun: 40
  };

  // Generate tools for each category
  Object.entries(CAT_DIST).forEach(([cat, count]) => {
    for (let i = 0; i < count; i++) {
      const origin = ORIGINS[(tools.length + i) % ORIGINS.length];
      const costIdx = Math.floor(Math.random() * 3);
      const cost = COST_TYPES[costIdx];
      const isChina = (tools.length + i) % 12 === 0;
      const rating = parseFloat((3.3 + Math.random() * 1.6).toFixed(2));
      const ctx = ["chat", "code", "research"].includes(cat) 
        ? [4096, 8192, 16000, 32000, 64000, 128000, 200000, 1000000][Math.floor(Math.random() * 8)] 
        : 0;
      const spd = cat === "chat" ? 35 + Math.floor(Math.random() * 165) 
        : cat === "code" ? 25 + Math.floor(Math.random() * 75) 
        : cat === "video" ? 5 + Math.floor(Math.random() * 15) 
        : cat === "image" ? 8 + Math.floor(Math.random() * 22) 
        : cat === "audio" ? 25 + Math.floor(Math.random() * 155)

        spd: spd,

        use: USE_CASES[(tools.length + i) % USE_CASES.length],
        detail: cost === "free" ? "Completely free, no credit card required. Community support included." 
          : cost === "trial" ? `Free trial included — then $${price}/mo. Cancel anytime.` 
          : `Starting at $${price}/mo. Annual billing discounts available.`,
        isGoogle: false,

    }
  });
  
  return tools;
}

// ============= NAVIGATION HANDLERS =============
function navigate(pageId) {
  state.currentPage = pageId;
  state.page = 1;
  state.searchQuery = "";
  
  // Update search input
  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    searchInput.value = "";
  }
  
  // Update active nav item
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === pageId);
    el.setAttribute('aria-current', el.dataset.nav === pageId ? 'page' : 'false');
  });
  
  // Re-render content
  renderContent();
  
  // Close mobile sidebar if open
  if (window.innerWidth < 1024) {
    closeSidebar();
  }
  
  // Scroll to top smoothly
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // Update URL hash for deep linking
  history.replaceState(null, null, `#${pageId}`);
}

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlayBg");
  const toggle = document.getElementById("mobileToggle");
  
  if (sidebar && overlay && toggle) {
    sidebar.classList.toggle("open");
    overlay.classList.toggle("active");
    toggle.setAttribute('aria-expanded', sidebar.classList.contains('open'));
  }
}

function closeSidebar() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlayBg");
  const toggle = document.getElementById("mobileToggle");
  
  if (sidebar && overlay && toggle) {
    sidebar.classList.remove("open");
    overlay.classList.remove("active");
    toggle.setAttribute('aria-expanded', 'false');
  }
}

// ============= FILTERING LOGIC =============
function getFilteredTools() {
  let tools = [...ALL_TOOLS];

  // Category/section filtering
  if (state.currentPage === "google") {
    tools = tools.filter(t => t.isGoogle);
  } else if (state.currentPage === "top10") {
    tools = [...ALL_TOOLS].sort((a, b) => b.rating - a.rating).slice(0, 10);
  } else if (state.currentPage === "filter-free") {
    tools = tools.filter(t => t.cost === "free");
  } else if (state.currentPage === "filter-paid") {
    tools = tools.filter(t => t.cost === "paid");
  } else if (state.currentPage === "filter-trial") {
    tools = tools.filter(t => t.cost === "trial");
  } else if (state.currentPage !== "all" && CATEGORIES[state.currentPage]) {
    tools = tools.filter(t => t.cat === state.currentPage);
  }

  // Search filtering
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase().trim();
    tools = tools.filter(t =>
      t.name?.toLowerCase().includes(q) ||
      t.desc?.toLowerCase().includes(q) ||
      t.origin?.toLowerCase().includes(q) ||
      t.category?.toLowerCase().includes(q) ||
      t.use?.toLowerCase().includes(q) ||
      t.features?.some(f => f.toLowerCase().includes(q))
    );
  }

  // Sorting
  if (state.sortBy && state.currentPage !== "top10") {
    tools.sort((a, b) => {
      let comparison = 0;
      if (state.sortBy === "rating") comparison = b.rating - a.rating;
      else if (state.sortBy === "name") comparison = a.name.localeCompare(b.name);
      else if (state.sortBy === "price") comparison = (a.price || 0) - (b.price || 0);
      else if (state.sortBy === "ctx") comparison = (b.ctx || 0) - (a.ctx || 0);
      return state.sortOrder === "desc" ? -comparison : comparison;
    });
  }

  return tools;
}

}

function renderPagination(total) {
  if (total <= 1) return '';
  
  let html = `<nav class="pagination" role="navigation" aria-label="Pagination">`;
  html += `<button class="page-btn" ${state.page === 1 ? 'disabled' : ''} onclick="goPage(${state.page - 1})" aria-label="Previous page">←</button>`;
  
  const maxShow = 5;
  let startP = Math.max(1, state.page - 2);
  let endP = Math.min(total, startP + maxShow - 1);
  if (endP - startP < maxShow - 1) startP = Math.max(1, endP - maxShow + 1);
  
  for (let i = startP; i <= endP; i++) {
    html += `<button class="page-btn ${i === state.page ? 'active' : ''}" onclick="goPage(${i})" aria-current="${i === state.page ? 'page' : 'false'}" aria-label="Page ${i}">${i}</button>`;
  }
  
  html += `<button class="page-btn" ${state.page === total ? 'disabled' : ''} onclick="goPage(${state.page + 1})" aria-label="Next page">→</button>`;
  html += `</nav>`;
  
  return html;
}

// ============= CHART INITIALIZATION =============
let mainChart = null;

function updateChart(metric, btn) {
  // Update tab states
  document.querySelectorAll('.chart-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected', 'false');
  });
  if (btn) {
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
  }
  
  if (!mainChart) return;
  
  // Get top tools by rating
  const tools = [...ALL_TOOLS].sort((a, b) => b.rating - a.rating).slice(0, CONFIG.maxChartItems);
  
  let data, label, maxVal;
  if (metric === 'rating') {
    data = tools.map(t => t.rating);
    label = "Rating (/5)";
    maxVal = 5;
  } else if (metric === 'ctx') {
    const ctxTools = tools.filter(t => t.ctx > 0).slice(0, CONFIG.maxChartItems);
    data = ctxTools.map(t => t.ctx / 1000);
    label = "Context (K tokens)";
    maxVal = Math.ceil(Math.max(...data) / 100) * 100;
  } else {
    const spdTools = tools.filter(t => t.spd > 0).slice(0, CONFIG.maxChartItems);
    data = spdTools.map(t => t.spd);
    label = "Speed (tokens/sec)";
    maxVal = Math.ceil(Math.max(...data) / 10) * 10;
  }
  
  const colors = tools.map(t => {
    if (t.isGoogle) return '#4285F4';
    if (t.cost === 'free') return '#34d399';
    if (t.cost === 'trial') return '#fbbf24';
    return '#f472b6';
  });
  
  // Update chart
  mainChart.data.labels = tools.map(t => t.name.length > 18 ? t.name.slice(0, 16) + '…' : t.name);
  mainChart.data.datasets[0].data = data;
  mainChart.data.datasets[0].label = label;
  mainChart.data.datasets[0].backgroundColor = colors;
  mainChart.options.scales.y.max = maxVal;
  mainChart.options.scales.y.title.text = label;
  mainChart.update();
}

function initChart() {
  const canvas = document.getElementById('mainChart');
  if (!canvas || typeof Chart === 'undefined') return;
  
  if (mainChart) mainChart.destroy();
  
  const tools = [...ALL_TOOLS].sort((a, b) => b.rating - a.rating).slice(0, CONFIG.maxChartItems);
  const ctx = canvas.getContext('2d');
  
  // Gradient for bars
  const gradient = ctx.createLinearGradient(0, 0, 0, 300);
  gradient.addColorStop(0, 'rgba(99, 102, 241, 0.9)');
  gradient.addColorStop(1, 'rgba(167, 139, 250, 0.7)');
  
  mainChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: tools.map(t => t.name.length > 18 ? t.name.slice(0, 16) + '…' : t.name),
      datasets: [{
        label: 'Rating (/5)',
        data: tools.map(t => t.rating),
        backgroundColor: tools.map(t => {
          if (t.isGoogle) return '#4285F4';
          if (t.cost === 'free') return '#34d399';
          if (t.cost === 'trial') return '#fbbf24';
          return '#f472b6';
        }),
        borderRadius: 8,
        borderSkipped: false,
        maxBarThickness: 32
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 400, easing: 'easeOutQuart' },
      plugins: {
        tooltip: {
          backgroundColor: 'rgba(20, 20, 36, 0.95)',
          titleColor: '#fff',
          bodyColor: '#c7c7d6',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          padding: 12,
          displayColors: false,
          callbacks: {
            label: context => `${context.raw} / 5.0`
          }
        },
        legend: { display: false }
      },
      scales: {
        y: {
          beginAtZero: true,
          max: 5,
          grid: { color: 'rgba(255,255,255,0.06)' },
          ticks: { 
            color: '#8a8a9e', 
            stepSize: 1,
            font: { size: 11 }
          },
          title: {
            display: true,
            text: 'Rating (/5)',
            color: '#8a8a9e',
            font: { size: 12, weight: '500' }
          }
        },
        x: {
          grid: { display: false },
          ticks: { 
            maxRotation: 45, 
            minRotation: 45,
            font: { size: 10 },
            color: '#8a8a9e'
          }
        }
      }
    }
  });
}

// ============= MODAL FUNCTIONS =============
function showToolModal(toolData) {
  // Parse tool data safely
  let tool;
  try {
    tool = JSON.parse(toolData.replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
  } catch (e) {
    console.error('Failed to parse tool data', e);
    return;
  }
  
  const modal = document.getElementById("modalOverlay");
  const body = document.getElementById("modalBody");
  if (!modal || !body) return;
  
  const catInfo = CATEGORIES[tool.cat] || { icon: "📦", name: tool.category || "AI" };
  const costLabel = COST_LABELS[tool.cost] || "Free";
  const costClass = tool.cost === "free" ? "free" : tool.cost === "paid" ? "paid" : "trial";
  const stars = "★".repeat(Math.floor(tool.rating)) + (tool.rating % 1 >= 0.5 ? "½" : "") + "☆".repeat(5 - Math.ceil(tool.rating));
  
  body.innerHTML = `
    <h2 id="modalTitle" class="modal-name">${tool.name}</h2>
    <div class="modal-url" aria-label="Website">${tool.url} · ${tool.origin || 'Unknown'}</div>
    
    <div class="modal-badges" role="list" aria-label="Tool badges">
      <span class="badge badge-${costClass}" role="listitem">${costLabel}</span>
      ${tool.isGoogle ? '<span class="badge badge-google" role="listitem">🔵 Google AI</span>' : ''}
      <span class="badge badge-cat" role="listitem">${catInfo.icon} ${catInfo.name}</span>
    </div>
    
    <p class="modal-desc">${tool.desc}</p>
    
    <div class="modal-use">
      <h4>✨ How to Use This Tool</h4>
      <p>${tool.use || 'Explore this tool for your workflow.'}</p>
    </div>
    
    <div class="modal-stats" role="list" aria-label="Tool statistics">
      <div class="modal-stat" role="listitem">
        <div class="ms-val" style="color:var(--accent-amber)">⭐ ${tool.rating}</div>
        <div class="ms-lbl">Rating</div>
      </div>
      <div class="modal-stat" role="listitem">
        <div class="ms-val">${tool.ctx > 0 ? (tool.ctx >= 1000000 ? (tool.ctx/1000000).toFixed(1)+'M' : (tool.ctx/1000).toFixed(0)+'K') : '—'}</div>
        <div class="ms-lbl">Context</div>
      </div>
      <div class="modal-stat" role="listitem">
        <div class="ms-val">${tool.spd > 0 ? tool.spd+'/s' : '—'}</div>
        <div class="ms-lbl">Speed</div>
      </div>
      <div class="modal-stat" role="listitem">
        <div class="ms-val">${tool.cost === 'free' ? '$0' : tool.price > 0 ? '$'+tool.price+'/mo' : 'Custom'}</div>
        <div class="ms-lbl">Price</div>
      </div>
    </div>
    
    ${tool.detail ? `
      <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:16px;margin-bottom:24px;font-size:13px;color:var(--text-secondary);border:1px solid var(--border-subtle)">
        ${tool.detail}
      </div>
    ` : ''}
    
    ${tool.features?.length ? `
      <div style="margin-bottom:24px">
        <strong style="font-size:13px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:10px">Key Features</strong>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${tool.features.map(f => `<span style="background:var(--bg-tertiary);padding:4px 12px;border-radius:20px;font-size:11px;color:var(--text-secondary);border:1px solid var(--border-subtle)">${f}</span>`).join('')}
        </div>
      </div>
    ` : ''}
    
    <a href="https://${tool.url}" target="_blank" rel="noopener noreferrer" class="modal-link" aria-label="Visit ${tool.url} in new tab">
      🌐 Visit ${tool.url} →
    </a>
  `;
  
  modal.classList.add("active");
  document.body.style.overflow = 'hidden';
  
  // Focus management for accessibility
  const closeBtn = modal.querySelector('.modal-close');
  if (closeBtn) closeBtn.focus();
}

function closeModal() {
  const modal = document.getElementById("modalOverlay");
  if (modal) {
    modal.classList.remove("active");
    document.body.style.overflow = '';
  }
}

function handleModalClose(event) {
  if (event.target === document.getElementById("modalOverlay")) {
    closeModal();
  }
}

// Close modal on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    closeSidebar();
  }
});

// ============= SEARCH FUNCTIONALITY =============
let searchTimeout;
function setupSearch() {
  const searchInput = document.getElementById("searchInput");
  if (!searchInput) return;
  
  searchInput.addEventListener("input", (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      state.searchQuery = e.target.value.trim();
      state.page = 1;
      renderContent();
    }, CONFIG.searchDebounce);
  });
  
  // Clear search on Escape
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === 'Escape' && searchInput.value) {
      searchInput.value = '';
      state.searchQuery = '';
      renderContent();
    }
  });
}

// ============= INITIALIZATION =============
function init() {
  // Render navigation
  renderNav();
  
  // Setup search
  setupSearch();
  
  // Handle URL hash for deep linking
  const hash = window.location.hash.slice(1);
  if (hash && CATEGORIES[hash]) {
    state.currentPage = hash;
  }
  
  // Initial render
  renderContent();
  
  // Keyboard navigation for cards
  document.addEventListener('click', (e) => {
    if (e.target.closest('.tool-card') && !e.target.closest('.modal-overlay')) {
      // Modal will handle the click via onclick
    }
  });
  
  // Handle window resize for responsive behavior
  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      if (window.innerWidth >= 1024) {
        closeSidebar();
      }
    }, 150);
  });
  
  // Preload chart library if needed
  if (typeof Chart === 'undefined' && (state.currentPage === "all" || state.currentPage === "google")) {
    console.log('Chart.js not loaded, chart will initialize when available');
  }
}

// Start the app when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
